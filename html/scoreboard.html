<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Scoreboard</title>
</head>
<body class="bg-gray-100 text-gray-900 p-4">
    <main class="bg-white border border-gray-300 rounded p-6 max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Scoreboard</h1>

        <div class="flex items-center gap-2 mb-4">
            <label for="filter">Dificuldade</label>
            <select id="filter" class="border border-gray-400 rounded p-1">
                <option value="">Todas</option>
                <option>3x3</option>
                <option>6x6</option>
                <option>9x9</option>
                <option>12x12</option>
                <option>15x15</option>
            </select>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <caption class="sr-only">Melhores resultados</caption>
                <thead>
                    <tr class="bg-gray-200">
                        <th class="p-2">#</th>
                        <th class="p-2">Jogador</th>
                        <th class="p-2">Pontos</th>
                        <th class="p-2">Dificuldade</th>
                        <th class="p-2">Tempo</th>
                        <th class="p-2 hidden sm:table-cell">Data</th>
                    </tr>
                </thead>
                <tbody id="score-body"></tbody>
            </table>
        </div>

        <div class="mt-4 flex gap-3">
            <a class="border border-gray-400 bg-white px-4 py-2 rounded hover:bg-gray-100" href="index.html">Início</a>
        </div>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/scoreboard.js"></script>
</body>
</html>
