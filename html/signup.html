<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Criar Conta</title>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex items-center justify-center p-4">
    <main class="bg-white border border-gray-300 rounded p-6 max-w-sm w-full">
        <h1 class="text-2xl font-bold mb-4">Criar conta</h1>

        <form id="signup-form" novalidate class="flex flex-col gap-2">
            <div id="error" role="alert" class="hidden bg-red-100 border border-red-400 text-red-700 rounded p-2 text-sm"></div>

            <label for="name">Nome de usuário</label>
            <input class="border border-gray-400 rounded p-2 mb-2" id="name" name="name" autocomplete="username" required>

            <label for="email">E-mail</label>
            <input class="border border-gray-400 rounded p-2 mb-2" id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Senha (mín. 6 caracteres)</label>
            <input class="border border-gray-400 rounded p-2 mb-2" id="password" name="password" type="password" autocomplete="new-password" required>

            <label for="confirm">Confirmar senha</label>
            <input class="border border-gray-400 rounded p-2 mb-2" id="confirm" name="confirm" type="password" autocomplete="new-password" required>

            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Criar conta</button>
        </form>

        <p class="mt-4 text-sm">
            Já tem conta?
            <a class="text-blue-700 underline" href="login.html">Entrar</a> |
            <a class="text-blue-700 underline" href="index.html">Início</a>
        </p>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
