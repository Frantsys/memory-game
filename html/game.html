<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Jogo da Memória</title>
</head>
<body class="bg-gray-100 text-gray-900 p-3 sm:p-4">
    <header class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2 mb-4">
        <a href="index.html" class="font-bold">Jogo da Memória</a>
        <nav class="flex items-center gap-2 text-sm">
            <span>Jogador: <strong id="user-name"></strong></span>
            <a class="border border-gray-400 bg-white px-3 py-1 rounded hover:bg-gray-100" href="scoreboard.html">Scoreboard</a>
            <button id="logout" class="border border-gray-400 bg-white px-3 py-1 rounded hover:bg-gray-100">Sair</button>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto">
        <section id="select">
            <h1 class="text-2xl font-bold mb-1">Escolha a dificuldade</h1>
            <p class="mb-4">Em tabuleiros ímpares, o centro tem uma carta coringa ⭐ já revelada.</p>
            <div id="difficulties" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
        </section>

        <section id="play" class="hidden">
            <dl class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4 text-center">
                <div class="bg-white border border-gray-300 rounded p-2">
                    <dt class="text-xs text-gray-600">Tempo</dt>
                    <dd id="time" class="font-bold text-lg"></dd>
                </div>
                <div class="bg-white border border-gray-300 rounded p-2">
                    <dt class="text-xs text-gray-600">Pontos</dt>
                    <dd id="score" class="font-bold text-lg"></dd>
                </div>
                <div class="bg-white border border-gray-300 rounded p-2">
                    <dt class="text-xs text-gray-600">Pares</dt>
                    <dd id="pairs" class="font-bold text-lg"></dd>
                </div>
                <div class="bg-white border border-gray-300 rounded p-2">
                    <dt class="text-xs text-gray-600">Tentativas</dt>
                    <dd id="tries" class="font-bold text-lg"></dd>
                </div>
                <div class="bg-white border border-gray-300 rounded p-2 col-span-2 sm:col-span-1">
                    <dt class="text-xs text-gray-600">Dificuldade</dt>
                    <dd id="diff" class="font-bold text-lg"></dd>
                </div>
            </dl>

            <div id="board" aria-label="Tabuleiro de cartas"></div>

            <div class="mt-4 flex justify-center gap-3">
                <button id="restart" type="button" class="border border-gray-400 bg-white px-4 py-2 rounded hover:bg-gray-100">Reiniciar</button>
                <button id="abandon" type="button" class="border border-gray-400 bg-white px-4 py-2 rounded hover:bg-gray-100">Abandonar</button>
            </div>
        </section>
    </main>

    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white border border-gray-400 rounded p-6 max-w-sm w-full text-center">
            <h2 id="modal-title" class="text-2xl font-bold mb-2"></h2>
            <p id="modal-text" class="mb-4"></p>
            <div class="flex flex-col gap-2">
                <button id="modal-again" type="button" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Jogar novamente</button>
                <button id="modal-change" type="button" class="border border-gray-400 bg-white px-4 py-2 rounded hover:bg-gray-100">Trocar dificuldade</button>
                <a id="modal-board" href="scoreboard.html" class="hidden border border-gray-400 bg-white px-4 py-2 rounded hover:bg-gray-100">Ver scoreboard</a>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/scoreboard.js"></script>
    <script src="../js/game.js"></script>
</body>
</html>
